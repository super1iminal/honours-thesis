name: ubc_thesis
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.9
  - pytorch=1.12.1
  - cpuonly            # the analysis runs on the CPU; drop this line to get a CUDA build
  - numpy=1.26
  - scipy=1.13
  - sympy=1.13
  - pandas=2.2
  - matplotlib=3.9
  - tqdm=4.67          # used by auto-lirpa but not declared as its dependency
  - setuptools<81      # pytorch 1.12 imports pkg_resources, which setuptools 81 removes
  - pip
  - pip:
      # only needed by cartpole.py (training and verifying the learned controller)
      - auto-lirpa==0.3
      - docplex==2.28.240
      - cplex==22.1.1.2
